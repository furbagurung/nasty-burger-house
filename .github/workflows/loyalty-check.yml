name: Validate Nasty Burger loyalty checkout

on:
  push:
    branches: [main]
    paths:
      - "app/lib/square/**"
      - "app/api/orders/route.ts"
      - "app/api/account/rewards/**"
      - "app/api/cron/expire-square-rewards/**"
      - "app/components/checkout-page.tsx"
      - "app/components/checkout-reward-picker.tsx"
      - "vercel.json"
      - ".github/workflows/loyalty-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx eslint app/components/checkout-reward-picker.tsx app/lib/square/rewards.ts app/lib/square/reward-identity.ts app/lib/square/loyalty.ts app/lib/square/checkout.ts app/api/account/rewards/route.ts app/api/orders/route.ts app/api/cron/expire-square-rewards/route.ts
      - run: npx tsc --noEmit
        continue-on-error: true # Existing app/layout.tsx LayoutProps error; don't skip focused tests.
      - run: node --test tests/*.test.mjs
      - run: npm run build
